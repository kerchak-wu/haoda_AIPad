# ===============================
# 站点基础信息
# ===============================
title: 好搭AI派AIcodinig项目库
description: 好搭AI派项目代码和说明文档
url: "https://kerchak-wu.github.io"  # 如果是用户站点，填写 https://你的用户名.github.io
baseurl: "/haoda_AIPad"    # 如果是项目站点，填写 https://你的用户名.github.io/仓库名

# ===============================
# 主题配置 (使用 Chirpy)
# ===============================
remote_theme: cotes2020/jekyll-theme-chirpy

# ===============================
# 启用远程主题插件（必须！）
# ===============================
plugins:
  - jekyll-remote-theme

# ===============================
# 社交媒体与作者
# ===============================
social:
  name: kerchak-wu@github
  email: 65176556@qq.com
  links:
    - https://github.com/kerchak-wu/haoda_AIPad
    # 如果有GitHub项目地址可以加在这里

# ===============================
# 网站外观
# ===============================
theme_mode: dark  # dark / light
avatar:           # 头像图片路径，可留空

# ===============================
# 语言与日期格式
# ===============================
lang: zh-CN
timezone: Asia/Shanghai

# ===============================
# Jekyll 构建配置
# ===============================
markdown: kramdown
highlighter: rouge
permalink: /:title/

# ===============================
# 排除文件（不打包到站点）
# ===============================
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# ===============================
# 默认布局
# ===============================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ===============================
# 分页配置（如需要）
# ===============================
paginate: 10
paginate_path: /page/:num/

# ===============================
# 收藏集（用于项目展示）
# ===============================
collections:
  projects:
    output: true
    permalink: /projects/:title/
