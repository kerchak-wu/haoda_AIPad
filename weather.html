<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气预报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 1s ease;
    color: #fff;
  }
  body.bg-clear-day    { background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%); }
  body.bg-clear-night  { background: linear-gradient(135deg, #141E30 0%, #243B55 100%); }
  body.bg-cloudy       { background: linear-gradient(135deg, #757F9A 0%, #D7DDE8 100%); }
  body.bg-rain         { background: linear-gradient(135deg, #3E5151 0%, #DECBA4 100%); }
  body.bg-snow         { background: linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%); }
  body.bg-thunder      { background: linear-gradient(135deg, #232526 0%, #414345 100%); }
  body.bg-fog          { background: linear-gradient(135deg, #606c88 0%, #3f4c6b 100%); }

  .app {
    width: 100%;
    max-width: 920px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 28px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  /* 顶部：城市选择 */
  .topbar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap { position: relative; flex: 1; min-width: 220px; }
  .search-wrap input {
    width: 100%;
    padding: 14px 18px 14px 46px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.7); }
  .search-wrap input:focus { background: rgba(255,255,255,0.3); }
  .search-wrap .icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; opacity: 0.8;
  }
  .suggest {
    position: absolute; top: 56px; left: 0; right: 0;
    background: rgba(30,40,60,0.95);
    border-radius: 14px; overflow: hidden; z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: none;
  }
  .suggest div {
    padding: 12px 18px; cursor: pointer; font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: 0.15s;
  }
  .suggest div:last-child { border-bottom: none; }
  .suggest div:hover { background: rgba(255,255,255,0.15); }
  .suggest .meta { font-size: 11px; opacity: 0.6; margin-left: 6px; }

  .quick {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .quick button {
    padding: 10px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.18);
    color: #fff; font-size: 13px; transition: 0.2s;
  }
  .quick button:hover { background: rgba(255,255,255,0.35); transform: translateY(-1px); }

  /* 当前天气主卡片 */
  .current {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 20px; margin-bottom: 28px;
  }
  .cur-left .city {
    font-size: 26px; font-weight: 600; margin-bottom: 4px;
    display: flex; align-items: center; gap: 10px;
  }
  .cur-left .date { font-size: 13px; opacity: 0.85; margin-bottom: 18px; }
  .cur-left .temp { font-size: 72px; font-weight: 200; line-height: 1; }
  .cur-left .temp small { font-size: 28px; vertical-align: top; }
  .cur-left .desc { font-size: 18px; margin-top: 6px; opacity: 0.95; }
  .cur-right {
    text-align: center; font-size: 96px; line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.2));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .cur-right .emoji { display: block; }
  .cur-right .feels { font-size: 13px; opacity: 0.85; margin-top: 10px; }

  /* 指标网格 */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .metric {
    background: rgba(255,255,255,0.12);
    border-radius: 16px; padding: 16px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .metric .label { font-size: 12px; opacity: 0.8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .metric .value { font-size: 20px; font-weight: 500; }
  .metric .value small { font-size: 13px; opacity: 0.8; margin-left: 3px; }

  /* 小时预报 */
  .section-title { font-size: 15px; margin-bottom: 12px; opacity: 0.9; font-weight: 500; display:flex; align-items:center; gap:8px;}
  .hourly {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
    margin-bottom: 28px; scrollbar-width: thin;
  }
  .hourly::-webkit-scrollbar { height: 6px; }
  .hourly::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
  .hour-card {
    min-width: 78px; background: rgba(255,255,255,0.12);
    border-radius: 16px; padding: 14px 8px; text-align: center;
    border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0;
  }
  .hour-card .h { font-size: 12px; opacity: 0.85; }
  .hour-card .e { font-size: 26px; margin: 6px 0; }
  .hour-card .t { font-size: 15px; font-weight: 500; }
  .hour-card .p { font-size: 11px; opacity: 0.75; margin-top: 2px; }

  /* 每日预报 */
  .daily { display: flex; flex-direction: column; gap: 8px; }
  .day-row {
    display: grid;
    grid-template-columns: 1.2fr 0.6fr 1.5fr 1fr;
    align-items: center; gap: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 14px; padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .day-row .name { font-size: 14px; }
  .day-row .e { font-size: 22px; text-align: center; }
  .day-row .bar-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .day-row .bar {
    flex: 1; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.25); position: relative; overflow: hidden;
  }
  .day-row .bar-fill {
    position: absolute; top: 0; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #4facfe, #f6d365, #ff8a5c);
  }
  .day-row .range { font-size: 13px; text-align: right; }

  /* 加载与错误 */
  .status { text-align: center; padding: 60px 0; font-size: 16px; opacity: 0.9; }
  .loader {
    width: 38px; height: 38px; border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .app { padding: 22px; border-radius: 22px; }
    .cur-left .temp { font-size: 56px; }
    .cur-right { font-size: 72px; }
    .cur-left .city { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- 顶部搜索 -->
    <div class="topbar">
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input id="search" type="text" placeholder="搜索城市，例如：北京 / Shanghai / Tokyo" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <div class="quick" id="quick"></div>
    </div>

    <!-- 内容区 -->
    <div id="content">
      <div class="status">
        <div class="loader"></div>
        正在加载天气…
      </div>
    </div>
  </div>

<script>
const WMO = {
  0:  ['晴', '☀️', 'clear-day'],
  1:  ['晴间多云', '🌤️', 'clear-day'],
  2:  ['多云', '⛅', 'cloudy'],
  3:  ['阴', '☁️', 'cloudy'],
  45: ['有雾', '🌫️', 'fog'],
  48: ['雾凇', '🌫️', 'fog'],
  51: ['小毛毛雨', '🌦️', 'rain'],
  53: ['毛毛雨', '🌦️', 'rain'],
  55: ['大毛毛雨', '🌧️', 'rain'],
  56: ['冻毛毛雨', '🌧️', 'rain'],
  57: ['冻雨', '🌧️', 'rain'],
  61: ['小雨', '🌦️', 'rain'],
  63: ['中雨', '🌧️', 'rain'],
  65: ['大雨', '🌧️', 'rain'],
  66: ['冻小雨', '🌧️', 'rain'],
  67: ['冻大雨', '🌧️', 'rain'],
  71: ['小雪', '🌨️', 'snow'],
  73: ['中雪', '🌨️', 'snow'],
  75: ['大雪', '❄️', 'snow'],
  77: ['米雪', '🌨️', 'snow'],
  80: ['小阵雨', '🌦️', 'rain'],
  81: ['阵雨', '🌧️', 'rain'],
  82: ['强阵雨', '⛈️', 'rain'],
  85: ['阵雪', '🌨️', 'snow'],
  86: ['强阵雪', '❄️', 'snow'],
  95: ['雷暴', '⛈️', 'thunder'],
  96: ['雷暴伴冰雹', '⛈️', 'thunder'],
  99: ['强雷暴伴冰雹', '⛈️', 'thunder'],
};

const QUICK_CITIES = [
  { name: '北京', q: 'Beijing' },
  { name: '上海', q: 'Shanghai' },
  { name: '广州', q: 'Guangzhou' },
  { name: '深圳', q: 'Shenzhen' },
  { name: '成都', q: 'Chengdu' },
  { name: '杭州', q: 'Hangzhou' },
  { name: '东京', q: 'Tokyo' },
  { name: '纽约', q: 'New York' },
];

const windDir = (deg) => {
  const dirs = ['北','东北偏北','东北','东北偏东','东','东南偏东','东南','东南偏南','南','西南偏南','西南','西南偏西','西','西北偏西','西北','西北偏北'];
  return dirs[Math.round(deg / 22.5) % 16];
};

const codeInfo = (code, isDay) => {
  const info = WMO[code] || ['未知', '🌡️', 'cloudy'];
  let cls = info[2];
  if (cls === 'clear-day' && !isDay) cls = 'clear-night';
  return { text: info[0], emoji: info[1], cls };
};

const fmtTime = (iso) => {
  const d = new Date(iso);
  return d.getHours().toString().padStart(2,'0') + ':00';
};
const fmtDay = (iso, idx) => {
  if (idx === 0) return '今天';
  if (idx === 1) return '明天';
  const d = new Date(iso);
  const w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()} ${w}`;
};

async function geocode(query) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=zh&format=json`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('geocode failed');
  const j = await r.json();
  return j.results || [];
}

async function getWeather(lat, lon, tz) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,visibility,uv_index` +
    `&hourly=temperature_2m,weather_code,precipitation_probability,is_day` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,wind_speed_10m_max` +
    `&timezone=${encodeURIComponent(tz || 'auto')}&forecast_days=7`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('weather failed');
  return await r.json();
}

function setBackground(cls) {
  document.body.className = '';
  document.body.classList.add('bg-' + cls);
}

function render(city, w) {
  const cur = w.current;
  const isDay = cur.is_day === 1;
  const ci = codeInfo(cur.weather_code, isDay);
  setBackground(ci.cls);

  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][now.getDay()]}`;

  // 取从当前小时起的 12 小时
  const hTimes = w.hourly.time;
  const startIdx = (() => {
    const nowIso = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,13);
    let idx = hTimes.findIndex(t => t.startsWith(nowIso.slice(0,13)) || t >= nowIso);
    if (idx < 0) idx = 0;
    return idx;
  })();
  const hours = [];
  for (let i = 0; i < 12; i++) {
    const k = startIdx + i;
    if (k >= hTimes.length) break;
    const hi = codeInfo(w.hourly.weather_code[k], w.hourly.is_day[k] === 1);
    hours.push({
      t: fmtTime(hTimes[k]),
      e: hi.emoji,
      temp: Math.round(w.hourly.temperature_2m[k]),
      p: w.hourly.precipitation_probability[k] ?? 0,
    });
  }

  // 每日
  const allMins = Math.min(...w.daily.temperature_2m_min);
  const allMaxs = Math.max(...w.daily.temperature_2m_max);
  const span = Math.max(1, allMaxs - allMins);
  const days = w.daily.time.map((t, i) => {
    const di = codeInfo(w.daily.weather_code[i], true);
    const min = w.daily.temperature_2m_min[i];
    const max = w.daily.temperature_2m_max[i];
    const left = ((min - allMins) / span) * 100;
    const width = ((max - min) / span) * 100;
    return {
      name: fmtDay(t, i),
      e: di.emoji,
      min: Math.round(min), max: Math.round(max),
      left, width,
    };
  });

  const sunrise = new Date(w.daily.sunrise[0]).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  const sunset = new Date(w.daily.sunset[0]).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

  const html = `
    <div class="current">
      <div class="cur-left">
        <div class="city">📍 ${city.name}${city.country ? `<span style="font-size:13px;opacity:0.7;font-weight:400">${city.admin1 ? city.admin1 + ' · ' : ''}${city.country}</span>` : ''}</div>
        <div class="date">${dateStr} · 本地时间 ${now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
        <div class="temp">${Math.round(cur.temperature_2m)}<small>°C</small></div>
        <div class="desc">${ci.text} · 体感 ${Math.round(cur.apparent_temperature)}°C</div>
      </div>
      <div class="cur-right">
        <span class="emoji">${ci.emoji}</span>
        <div class="feels">${ci.text}</div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="label">💧 湿度</div><div class="value">${cur.relative_humidity_2m}<small>%</small></div></div>
      <div class="metric"><div class="label">🌬️ 风速</div><div class="value">${Math.round(cur.wind_speed_10m)}<small>km/h ${windDir(cur.wind_direction_10m)}</small></div></div>
      <div class="metric"><div class="label">🌡️ 气压</div><div class="value">${Math.round(cur.pressure_msl)}<small>hPa</small></div></div>
      <div class="metric"><div class="label">👁️ 能见度</div><div class="value">${(cur.visibility/1000).toFixed(1)}<small>km</small></div></div>
      <div class="metric"><div class="label">☀️ 紫外线</div><div class="value">${(cur.uv_index ?? 0).toFixed(1)}</div></div>
      <div class="metric"><div class="label">🌅 日出/落</div><div class="value" style="font-size:15px">${sunrise} / ${sunset}</div></div>
    </div>

    <div class="section-title">🕐 未来 12 小时</div>
    <div class="hourly">
      ${hours.map(h => `
        <div class="hour-card">
          <div class="h">${h.t}</div>
          <div class="e">${h.e}</div>
          <div class="t">${h.temp}°</div>
          <div class="p">${h.p > 0 ? '💧'+h.p+'%' : ''}</div>
        </div>
      `).join('')}
    </div>

    <div class="section-title">📅 7 天预报</div>
    <div class="daily">
      ${days.map(d => `
        <div class="day-row">
          <div class="name">${d.name}</div>
          <div class="e">${d.e}</div>
          <div class="bar-wrap">
            <span>${d.min}°</span>
            <div class="bar"><div class="bar-fill" style="left:${d.left}%;width:${d.width}%"></div></div>
            <span>${d.max}°</span>
          </div>
          <div class="range"></div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="status">😕 ${msg}</div>`;
}

async function loadCity(city) {
  document.getElementById('suggest').style.display = 'none';
  document.getElementById('content').innerHTML = `<div class="status"><div class="loader"></div>正在获取「${city.name}」的天气…</div>`;
  try {
    const w = await getWeather(city.latitude, city.longitude, city.timezone);
    render(city, w);
  } catch (e) {
    showError('获取天气数据失败，请检查网络后重试。');
  }
}

// 快捷城市
const quickEl = document.getElementById('quick');
QUICK_CITIES.forEach(c => {
  const b = document.createElement('button');
  b.textContent = c.name;
  b.onclick = () => {
    document.getElementById('search').value = c.name;
    doSearch(c.q, true);
  };
  quickEl.appendChild(b);
});

// 搜索建议
const searchInput = document.getElementById('search');
const suggestEl = document.getElementById('suggest');
let suggestTimer = null;
let lastResults = [];

searchInput.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  const q = searchInput.value.trim();
  if (!q) { suggestEl.style.display = 'none'; return; }
  suggestTimer = setTimeout(async () => {
    try {
      const results = await geocode(q);
      lastResults = results;
      if (!results.length) { suggestEl.style.display = 'none'; return; }
      suggestEl.innerHTML = results.map((r, i) =>
        `<div data-idx="${i}">${r.name}<span class="meta">${[r.admin1, r.country].filter(Boolean).join(' · ')}</span></div>`
      ).join('');
      suggestEl.style.display = 'block';
      suggestEl.querySelectorAll('div').forEach(el => {
        el.onclick = () => {
          const idx = +el.dataset.idx;
          searchInput.value = lastResults[idx].name;
          loadCity(lastResults[idx]);
        };
      });
    } catch (e) { suggestEl.style.display = 'none'; }
  }, 350);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    if (!q) return;
    suggestEl.style.display = 'none';
    doSearch(q, false);
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) suggestEl.style.display = 'none';
});

async function doSearch(q, isLatQuery) {
  document.getElementById('content').innerHTML = `<div class="status"><div class="loader"></div>搜索中…</div>`;
  try {
    const results = await geocode(q);
    if (!results.length) { showError('未找到该城市，请换个名称试试。'); return; }
    loadCity(results[0]);
  } catch (e) { showError('搜索失败，请检查网络。'); }
}

// 默认加载北京
(async () => {
  try {
    const results = await geocode('Beijing');
    if (results.length) loadCity(results[0]);
  } catch (e) { showError('初始化失败，请检查网络。'); }
})();
</script>
</body>
</html>
