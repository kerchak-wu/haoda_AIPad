<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>好搭AI派 · 项目展示</title>
    <!-- marked.js 用于渲染 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 豆瓣风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "宋体", "SimSun", "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            line-height: 1.7;
            padding: 0;
        }

        a {
            color: #2d8c3c;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #1a6b28;
            text-decoration: underline;
        }

        /* ===== 豆瓣风格导航栏 ===== */
        .navbar {
            background: #ffffff;
            border-bottom: 3px solid #2d8c3c;
            padding: 16px 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 600;
            color: #2d8c3c;
            letter-spacing: 1px;
        }

        .navbar .brand .logo-icon {
            font-size: 28px;
        }

        .navbar .brand span {
            font-weight: 300;
            color: #999;
            font-size: 14px;
            margin-left: 6px;
        }

        .navbar .meta-info {
            font-size: 13px;
            color: #888;
            background: #f5f5f5;
            padding: 4px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .navbar .meta-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2d8c3c;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        /* ===== 加载 & 错误状态 ===== */
        .loading-box {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 16px;
        }

        .loading-box .spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 4px solid #e8e8e8;
            border-top: 4px solid #2d8c3c;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-box {
            text-align: center;
            padding: 60px 20px;
            color: #c0392b;
            background: #fff5f5;
            border-radius: 12px;
            border: 1px solid #fdd;
        }

        .error-box .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* ===== 内容卡片（豆瓣风格） ===== */
        .content-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 40px 48px;
            transition: box-shadow 0.3s;
        }

        .content-card:hover {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.09);
        }

        /* ===== Markdown 渲染样式 ===== */
        .markdown-body {
            font-size: 16px;
            color: #333;
        }

        .markdown-body h1 {
            font-size: 30px;
            font-weight: 600;
            color: #2d8c3c;
            border-left: 5px solid #2d8c3c;
            padding-left: 18px;
            margin: 0 0 24px 0;
            line-height: 1.3;
        }

        .markdown-body h2 {
            font-size: 24px;
            font-weight: 500;
            color: #2d8c3c;
            margin: 32px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #eef5ee;
        }

        .markdown-body h3 {
            font-size: 20px;
            font-weight: 500;
            color: #333;
            margin: 24px 0 12px 0;
        }

        .markdown-body p {
            margin: 0 0 16px 0;
            color: #444;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 24px;
            margin: 0 0 16px 0;
        }
        .markdown-body li {
            margin-bottom: 4px;
        }

        /* ===== 豆瓣风格链接列表（项目资料区） ===== */
        .markdown-body .file-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin: 16px 0 20px 0;
            padding: 16px 20px;
            background: #f9fbf9;
            border-radius: 10px;
            border: 1px solid #e8efe8;
        }

        .markdown-body .file-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            color: #2d8c3c;
            background: #fff;
            padding: 4px 14px 4px 10px;
            border-radius: 20px;
            border: 1px solid #dce8dc;
            transition: all 0.2s;
        }

        .markdown-body .file-links a:hover {
            background: #2d8c3c;
            color: #fff;
            border-color: #2d8c3c;
            text-decoration: none;
        }

        /* ===== 表格（项目列表） ===== */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0 24px 0;
            font-size: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .markdown-body table thead {
            background: #2d8c3c;
            color: #ffffff;
        }

        .markdown-body table thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 500;
            letter-spacing: 0.5px;
            font-size: 14px;
        }

        .markdown-body table tbody tr {
            border-bottom: 1px solid #edf2ed;
            transition: background 0.15s;
        }

        .markdown-body table tbody tr:nth-child(even) {
            background: #f8fbf8;
        }

        .markdown-body table tbody tr:hover {
            background: #f0f6f0;
        }

        .markdown-body table tbody td {
            padding: 12px 16px;
            vertical-align: middle;
        }

        .markdown-body table tbody td a {
            color: #2d8c3c;
            font-weight: 500;
        }

        .markdown-body table tbody td a:hover {
            color: #1a6b28;
            text-decoration: underline;
        }

        /* 表格中的标签小点缀 */
        .markdown-body table tbody td .badge {
            display: inline-block;
            font-size: 12px;
            background: #e8efe8;
            color: #2d8c3c;
            padding: 0 10px;
            border-radius: 12px;
            margin-right: 4px;
            font-weight: 400;
        }

        /* ===== 其他 Markdown 元素 ===== */
        .markdown-body hr {
            border: 0;
            border-top: 2px dashed #e0ece0;
            margin: 32px 0;
        }

        .markdown-body blockquote {
            border-left: 4px solid #2d8c3c;
            padding: 10px 20px;
            margin: 16px 0;
            background: #f6faf6;
            color: #555;
            border-radius: 0 8px 8px 0;
        }

        .markdown-body code {
            background: #f0f5f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #1a6b28;
        }

        .markdown-body pre {
            background: #f4f8f4;
            padding: 16px 20px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #e4ece4;
            font-size: 14px;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 28px 20px 20px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #edf2ed;
            margin-top: 40px;
        }

        .footer a {
            color: #2d8c3c;
        }

        .footer .heart {
            color: #e74c3c;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .navbar .brand {
                font-size: 18px;
            }
            .navbar .meta-info {
                font-size: 12px;
                padding: 2px 12px;
            }

            .container {
                padding: 16px 12px 40px;
            }

            .content-card {
                padding: 20px 16px;
                border-radius: 8px;
            }

            .markdown-body h1 {
                font-size: 24px;
                padding-left: 12px;
            }
            .markdown-body h2 {
                font-size: 20px;
            }

            .markdown-body table {
                font-size: 13px;
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .markdown-body table thead th,
            .markdown-body table tbody td {
                padding: 8px 12px;
            }

            .markdown-body .file-links {
                flex-direction: column;
                gap: 8px;
                padding: 12px 14px;
            }

            .markdown-body .file-links a {
                font-size: 14px;
                padding: 4px 12px 4px 8px;
            }
        }

        @media (max-width: 480px) {
            .navbar .brand {
                font-size: 16px;
                flex-wrap: wrap;
            }
            .navbar .brand span {
                font-size: 12px;
            }
            .markdown-body h1 {
                font-size: 20px;
            }
            .markdown-body h2 {
                font-size: 17px;
            }
            .markdown-body {
                font-size: 14px;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f5f0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8d0b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9bbf9b;
        }

        /* ===== 打印优化 ===== */
        @media print {
            .navbar {
                position: static;
                border-bottom: 2px solid #2d8c3c;
            }
            .content-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            .markdown-body table {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 豆瓣风格导航栏 ===== -->
    <header class="navbar">
        <div class="brand">
            <span class="logo-icon">📚</span>
            好搭AI派
            <span>· 项目展示</span>
        </div>
        <div class="meta-info">
            <span class="dot"></span>
            数据实时同步 · GitHub
        </div>
    </header>

    <!-- ===== 主容器 ===== -->
    <div class="container">
        <div id="app">
            <!-- 加载状态 -->
            <div id="loading" class="loading-box">
                <div class="spinner"></div>
                <p>正在加载项目资料 …</p>
            </div>

            <!-- 错误状态 -->
            <div id="error" class="error-box" style="display:none;">
                <div class="error-icon">⚠️</div>
                <p id="error-msg">加载失败，请稍后重试。</p>
                <p style="margin-top:12px;font-size:14px;color:#888;">
                    请确保仓库公开且 README.md 存在。
                </p>
            </div>

            <!-- 内容区域 -->
            <div id="content" class="content-card" style="display:none;">
                <div id="markdown-content" class="markdown-body"></div>
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <footer class="footer">
            <p>
                由 <a href="#" id="repo-link" target="_blank">GitHub 仓库</a>
                自动生成 ·
                <span class="heart">❤</span> 豆瓣风格
            </p>
            <p style="margin-top:4px;font-size:12px;color:#ccc;">
                内容随 README.md 实时更新 · 点击文件链接即可下载或查看
            </p>
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  ★ 零配置！自动从 Pages 网址识别仓库信息 ★
            //  如果自动识别失败（例如使用自定义域名），您可以取消注释下方
            //  两行并手动填写您的 GitHub 用户名和仓库名。
            // ============================================================
            // let REPO_OWNER = '你的GitHub用户名';
            // let REPO_NAME = '你的仓库名';
            let BRANCH = 'main'; // 分支名，通常为 main 或 master

            // ---------- 自动检测逻辑 ----------
            function detectFromUrl() {
                const hostname = window.location.hostname;
                const pathname = window.location.pathname;
                let owner = null;
                let repo = null;

                // 检测是否为 GitHub Pages 域名
                if (hostname.endsWith('.github.io')) {
                    const parts = hostname.split('.');
                    if (parts.length >= 3) {
                        owner = parts[0]; // 从 subdomain 获取 owner
                        // 解析路径第一段作为 repo 名
                        const pathParts = pathname.split('/').filter(p => p.length > 0);
                        if (pathParts.length > 0) {
                            repo = pathParts[0];
                        } else {
                            // 用户页面 (username.github.io)，仓库名就是 username.github.io
                            repo = `${owner}.github.io`;
                        }
                        return { owner, repo };
                    }
                }
                // 如果是 localhost 或其他环境，返回 null
                return null;
            }

            const detected = detectFromUrl();
            let REPO_OWNER = detected ? detected.owner : null;
            let REPO_NAME = detected ? detected.repo : null;

            // 如果检测失败且用户没有手动填写，给出明确的错误提示
            if (!REPO_OWNER || !REPO_NAME) {
                // 检查是否手动定义了（通过注释取消）
                if (typeof window._REPO_OWNER !== 'undefined' && typeof window._REPO_NAME !== 'undefined') {
                    REPO_OWNER = window._REPO_OWNER;
                    REPO_NAME = window._REPO_NAME;
                } else {
                    // 如果还是空，展示友好的配置提示
                    document.addEventListener('DOMContentLoaded', function() {
                        const loading = document.getElementById('loading');
                        const error = document.getElementById('error');
                        const errorMsg = document.getElementById('error-msg');
                        loading.style.display = 'none';
                        error.style.display = 'block';
                        errorMsg.innerHTML = `
                            <strong>⚠️ 自动识别仓库信息失败</strong><br>
                            如果您使用了自定义域名，请在 HTML 的 JavaScript 区域
                            <code style="background:#eee;padding:2px 6px;border-radius:4px;">取消注释</code> 
                            并手动填写 <code style="background:#eee;padding:2px 6px;border-radius:4px;">REPO_OWNER</code> 
                            和 <code style="background:#eee;padding:2px 6px;border-radius:4px;">REPO_NAME</code>。
                        `;
                    });
                    return; // 停止后续执行
                }
            }

            // ============================================================
            //  1. 获取 README.md 内容（使用 GitHub API）
            // ============================================================
            const API_URL =
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/README.md?ref=${BRANCH}`;

            async function fetchReadme() {
                const response = await fetch(API_URL, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                    }
                });

                if (!response.ok) {
                    let detail = '';
                    if (response.status === 404) {
                        detail = '未找到 README.md 文件，请确认文件存在。';
                    } else if (response.status === 403) {
                        detail = 'API 访问限制（每小时60次），请稍后再试。';
                    } else {
                        detail = `HTTP ${response.status} ${response.statusText}`;
                    }
                    throw new Error(detail);
                }

                const data = await response.json();
                const decoded = atob(data.content);
                return decoded;
            }

            // ============================================================
            //  2. 自定义 marked 渲染器 —— 处理内部链接
            // ============================================================
            const renderer = new marked.Renderer();
            const originalLink = renderer.link;

            renderer.link = function(href, title, text) {
                if (/^https?:\/\//i.test(href) || href.startsWith('#')) {
                    return originalLink.call(this, href, title, text);
                }

                const rawUrl =
                    `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${href}`;

                const ext = href.split('.').pop().toLowerCase();
                const downloadable = ['pdf', 'txt', 'py', 'md', 'zip', 'rar', '7z', 'csv', 'json', 'xml', 'html', 'css', 'js',
                    'jpg', 'jpeg', 'png', 'gif', 'svg', 'mp3', 'wav', 'mp4', 'avi', 'mov'
                ];
                const isDownloadable = downloadable.includes(ext);

                let linkHtml = `<a href="${rawUrl}" target="_blank" rel="noopener noreferrer"`;
                if (isDownloadable) {
                    linkHtml += ` download`;
                }
                if (title) {
                    linkHtml += ` title="${title}"`;
                }
                linkHtml += `>${text}</a>`;

                if (isDownloadable && ext) {
                    const iconMap = {
                        'pdf': '📄', 'txt': '📃', 'py': '🐍', 'md': '📝',
                        'zip': '📦', 'rar': '📦', '7z': '📦',
                        'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'svg': '🖼️',
                        'mp3': '🎵', 'wav': '🎵',
                        'mp4': '🎬', 'avi': '🎬', 'mov': '🎬',
                        'csv': '📊', 'json': '📋', 'xml': '📋',
                        'html': '🌐', 'css': '🎨', 'js': '⚡',
                    };
                    const icon = iconMap[ext] || '📎';
                    linkHtml = linkHtml.replace('</a>', ` <span style="font-size:12px;color:#999;">${icon}</span></a>`);
                }

                return linkHtml;
            };

            renderer.table = function(header, body) {
                return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
            };

            // ============================================================
            //  3. 渲染 Markdown 并增强
            // ============================================================
            function renderMarkdown(markdown) {
                let html = marked.parse(markdown, { renderer });
                markdownEl.innerHTML = html;

                const wrapper = markdownEl;

                // 包装项目资料链接
                const paragraphs = wrapper.querySelectorAll('p');
                paragraphs.forEach(p => {
                    const links = p.querySelectorAll('a');
                    if (links.length > 0) {
                        const textLen = p.textContent.trim().length;
                        let linkTextLen = 0;
                        links.forEach(a => { linkTextLen += a.textContent.length; });
                        if (textLen > 0 && linkTextLen / textLen > 0.6) {
                            const container = document.createElement('div');
                            container.className = 'file-links';
                            while (p.firstChild) {
                                container.appendChild(p.firstChild);
                            }
                            p.parentNode.replaceChild(container, p);
                        }
                    }
                });

                // 表格美化
                const tables = wrapper.querySelectorAll('table');
                tables.forEach(table => {
                    const rows = table.querySelectorAll('tbody tr');
                    rows.forEach((row, idx) => {
                        const firstCell = row.querySelector('td:first-child');
                        if (firstCell) {
                            const val = firstCell.textContent.trim();
                            if (/^\d+$/.test(val)) {
                                firstCell.innerHTML = `<span class="badge">#${val}</span>`;
                            }
                        }
                    });
                });

                // 下载提示
                const allLinks = wrapper.querySelectorAll('a[download]');
                allLinks.forEach(a => {
                    if (!a.hasAttribute('title')) {
                        a.setAttribute('title', '点击下载或查看文件');
                    }
                });
            }

            // ============================================================
            //  4. 主流程
            // ============================================================
            // DOM 元素
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const errorMsgEl = document.getElementById('error-msg');
            const contentEl = document.getElementById('content');
            const markdownEl = document.getElementById('markdown-content');
            const repoLinkEl = document.getElementById('repo-link');

            // 设置底部仓库链接
            repoLinkEl.href = `https://github.com/${REPO_OWNER}/${REPO_NAME}`;
            repoLinkEl.textContent = `${REPO_OWNER}/${REPO_NAME}`;

            async function init() {
                try {
                    loadingEl.style.display = 'block';
                    errorEl.style.display = 'none';
                    contentEl.style.display = 'none';

                    const markdown = await fetchReadme();

                    loadingEl.style.display = 'none';
                    contentEl.style.display = 'block';

                    renderMarkdown(markdown);

                } catch (err) {
                    console.error('加载失败:', err);
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    errorMsgEl.textContent = err.message || '加载失败，请检查网络或仓库设置。';
                    contentEl.style.display = 'none';
                }
            }

            // ============================================================
            //  5. 启动
            // ============================================================
            init();

        })();
    </script>

</body>
</html>
